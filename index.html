  const [x0, y0] = p(a0, r0), [x1, y1] = p(a1, r0),
        [x2, y2] = p(a1, r1), [x3, y3] = p(a0, r1);
  return `M${x0},${y0}A${r0},${r0} 0 ${large} 1 ${x1},${y1}` +
         `L${x2},${y2}A${r1},${r1} 0 ${large} 0 ${x3},${y3}Z`;
}

const svgNS = "http://www.w3.org/2000/svg";
const el = (t, at) => {
  const e = document.createElementNS(svgNS, t);
  for (const k in at) e.setAttribute(k, at[k]);
  return e;
};

function render() {
  const chart = document.getElementById("chart");
  chart.innerHTML = "";
  const H = W;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
                          "aria-label": "sunburst of checking time" });

  let labelId = 0;
  const labels = [];
  const tip = document.getElementById("tip");
  const total = root.seconds, zTotal = zoomRoot.seconds;

  function famOf(n) {
    let p = n.path.split("/")[0];
    return p || n.name;
  }

  function draw(node, a0, a1, ring) {
    if (node !== zoomRoot) {
      const r0 = R0 + ring * RING, r1 = r0 + RING - 2;
      const base = famColor(famOf(node));
      const rel = node.depth - zoomRoot.depth;
      const t = Math.min(0.62, 0.16 * (rel - 1));
      const fill = node.children ? shade(base, t) : shade(base, Math.min(0.7, t + 0.10));
      const path = el("path", {
        d: arcPath(a0, a1, r0, r1), fill, class: "arc",
        stroke: "var(--surface-1)", "stroke-width": "1.5",
      });
      path.addEventListener("mousemove", ev => {
        tip.style.display = "block";
        tip.style.left = Math.min(innerWidth - 380, ev.clientX + 14) + "px";
        tip.style.top = (ev.clientY + 14) + "px";
        tip.innerHTML =
          `<div class="p">${node.path}${node.children ? "/" : ""}</div>` +
          `<div><span class="v">${fmt(node.seconds)}</span>` +
          ` — ${(100 * node.seconds / total).toFixed(1)}% of total` +
          (zoomRoot !== root ? `, ${(100 * node.seconds / zTotal).toFixed(1)}% of ${zoomRoot.name}` : "") +
          `</div>`;
      });
      path.addEventListener("mouseleave", () => tip.style.display = "none");
      path.addEventListener("click", () => {
        if (node.children) { zoomRoot = node; render(); }
      });
      svg.appendChild(path);

      /* direct label following the arc's curve, one consistent (clockwise)
         reading direction for every label (directories and files alike) */
      const span = a1 - a0, rm = (r0 + r1) / 2, arcLen = span * rm;
      if (arcLen > 34) {
        const p = (a, r) => [CX + r * Math.sin(a), CX - r * Math.cos(a)];
        const large = span > Math.PI ? 1 : 0;
        const [xs, ys] = p(a0, rm);
        const [xe, ye] = p(a1, rm);
        const id = "lbl" + (labelId++);
        const guide = el("path", {
          id, fill: "none",
          d: `M${xs},${ys}A${rm},${rm} 0 ${large} 1 ${xe},${ye}`,
        });
        svg.appendChild(guide);
        const txt = el("text", { class: "albl" });
        txt.style.fill = inkFor(fill);
        const tp = el("textPath", { href: "#" + id, startOffset: "50%",
                                    "text-anchor": "middle" });
        tp.textContent = node.name;
        txt.appendChild(tp);
        svg.appendChild(txt);
        labels.push({ txt, tp, name: node.name, room: arcLen - 8 });
      }
    }
    if (node.children) {
      let a = a0;
      for (const c of node.children) {
        const sw = (a1 - a0) * (c.seconds / node.seconds || 0);
        draw(c, a, a + sw, node === zoomRoot ? 0 : ring + 1);
        a += sw;
      }
    }
  }
  draw(zoomRoot, 0, 2 * Math.PI, -1);

  /* center: current root + zoom out */
  const c = el("circle", { cx: CX, cy: CX, r: R0 - 4, fill: "var(--page)",
                           stroke: "var(--hairline)" });
  c.style.cursor = zoomRoot === root ? "default" : "pointer";
  c.addEventListener("click", () => {
    if (zoomRoot !== root) {
      let up = root;
      const parts = zoomRoot.path.split("/"); parts.pop();
      for (const p of parts) up = up.children.find(k => k.name === p) || up;
      zoomRoot = zoomRoot.path.includes("/") ? up : root;
      render();
    }
  });
  svg.appendChild(c);
  const t1 = el("text", { x: CX, y: CX - 6, class: "center-t", "text-anchor": "middle" });
  t1.textContent = zoomRoot.name;
  const t2 = el("text", { x: CX, y: CX + 12, class: "center-s", "text-anchor": "middle" });
  t2.textContent = fmt(zoomRoot.seconds);
  svg.appendChild(t1); svg.appendChild(t2);

  chart.appendChild(svg);

  /* fit pass: measure each label on its arc; trim to fit, drop if hopeless */
  for (const { txt, tp, name, room } of labels) {
    if (txt.getComputedTextLength() <= room) continue;
    let n = name.length;
    while (n > 2) {
      n--;
      tp.textContent = name.slice(0, n) + "…";
      if (txt.getComputedTextLength() <= room) break;
    }
    if (n <= 2) txt.remove();
  }

  /* breadcrumb: every ancestor is clickable */
  const cr = document.getElementById("crumbs");
  cr.innerHTML = "";
  const trail = [root];
  if (zoomRoot !== root) {
    let node = root;
    for (const p of zoomRoot.path.split("/")) {
      node = node.children.find(k => k.name === p);
      if (!node) break;
      trail.push(node);
    }
  }
  trail.forEach((node, i) => {
    if (i) cr.appendChild(document.createTextNode(" / "));
    if (node === zoomRoot) {
      const sp = document.createElement("span");
      sp.className = "here";
      sp.textContent = node.name;
      cr.appendChild(sp);
    } else {
      const a = document.createElement("a");
      a.textContent = node.name;
      a.addEventListener("click", () => { zoomRoot = node; render(); });
      cr.appendChild(a);
    }
  });

  /* legend */
  const lg = document.getElementById("legend");
  lg.innerHTML = "";
  for (const f of root.children) {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML =
      `<span class="sw" style="background:${famColor(f.name)}"></span>` +
      `<span class="nm">${f.name}</span>` +
      `<span class="tm">${fmt(f.seconds)} · ${(100 * f.seconds / total).toFixed(0)}%</span>`;
    row.addEventListener("click", () => { zoomRoot = f; render(); });
    lg.appendChild(row);
  }
}

/* subtitle from meta */
(function () {
  const m = DATA.meta || {};
  const bits = [];
  if (m.commit) bits.push(`commit ${m.commit}`);
  if (m.branch) bits.push(m.branch);
  if (m.date) bits.push(m.date.slice(0, 10));
  const n = (function cnt(x) {
    return x.children ? x.children.reduce((a, c) => a + cnt(c), 0) : 1; })(root);
  document.getElementById("subtitle").textContent =
    `${n} files · ${fmt(root.seconds)} cumulative` +
    (bits.length ? ` · ${bits.join(" · ")}` : "");
})();

/* table view (accessibility relief for low-contrast slots) */
(function () {
  const rows = [];
  (function walk(n) {
    if (n.children) n.children.forEach(walk);
    else rows.push(n);
  })(root);
  rows.sort((a, b) => b.seconds - a.seconds);
  const tb = document.querySelector("#tbl tbody");
  for (const r of rows) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${r.path}</td><td class="n">${r.seconds.toFixed(1)}</td>` +
                   `<td class="n">${(100 * r.seconds / root.seconds).toFixed(2)}</td>`;
    tb.appendChild(tr);
  }
})();

render();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
new MutationObserver(render).observe(document.documentElement,
  { attributes: true, attributeFilter: ["data-theme"] });
</script>
</body>
</html>
