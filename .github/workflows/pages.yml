name: pages

# Rebuilds the site on every push: the commit index is generated from the
# result files under data/ (pushed by jasmin-nist's CI), then site/, data/
# and the index are deployed to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Result pushes can arrive in bursts (proofs and bench finish independently);
# only the latest state needs deploying.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pages serves everything with max-age=600 (not configurable): version
      # the JS/CSS references with this commit, so once a browser refreshes
      # index.html it loads matching modules rather than cached old ones.
      - name: Build
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R data _site/data
          python3 tools/build_index.py data _site
          v="${GITHUB_SHA::12}"
          sed -i -E "s#(src|href)=\"([a-z]+)\.(js|css)\"#\1=\"\2.\3?v=$v\"#g" _site/index.html
          sed -i -E "s#from \"\./([a-z]+)\.js\"#from \"./\1.js?v=$v\"#g" _site/*.js
          grep -o '[a-z]*\.\(js\|css\)?v=[0-9a-f]*' _site/index.html _site/*.js

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # GitHub's artifact listing can lag the upload by a few seconds, and
      # deploy-pages then fails at once ("No artifacts named github-pages
      # were found"): wait and retry once before failing the job.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - if: steps.deploy.outcome == 'failure'
        run: sleep 20

      - id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
